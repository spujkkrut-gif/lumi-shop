backend:
  name: github
  repo: spujkkrut-gif/lumi-shop
  branch: main

media_folder: "content/images"
public_folder: "/images"

collections:
  - name: "catalog"
    label: "Каталог"
    files:
      - name: "products"
        label: "Товари"
        file: "content/products.json"
        fields:
          - label: "Список товарів"
            name: "items"
            widget: "list"
            fields:
              - {label: "Назва", name: "titleUA", widget: "string"}
              - {label: "Ціна", name: "price", widget: "number"}
              - {label: "Зображення", name: "image", widget: "image"}
              - {label: "Опис", name: "descUA", widget: "text"}
