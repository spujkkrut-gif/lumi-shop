<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMI.SHOP — Streetwear</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --accent: #d4af37;
            --border: #26262a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 110px;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* AI Disclaimer Banner */
        .ai-disclaimer {
            background: #1a1a1e;
            color: #ffcc00;
            padding: 12px 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.3px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            position: sticky;
            top: 0;
            background: rgba(11, 11, 11, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .lang-switch {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: var(--text-main);
            color: var(--bg-color);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            animation: slideUp 0.5s ease backwards;
        }

        .product-card:hover {
            border-color: #444;
            transform: translateY(-3px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-image-container {
            width: 100%;
            height: 420px;
            background: #111115;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.03);
        }

        .product-content {
            padding: 20px;
        }

        .badge {
            display: inline-block;
            background: #222;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }

        .buy-btn {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .buy-btn:active {
            transform: scale(0.95);
        }

        .buy-btn:hover {
            background: #e0e0e0;
        }

        /* Bottom Floating Menu */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 25, 28, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 30px;
            display: flex;
            gap: 4px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-x: auto;
            max-width: 95vw;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-item.active {
            background: var(--text-main);
            color: var(--bg-color);
        }

        /* Футер та контакти */
        footer.site-footer {
            margin-top: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .footer-content {
            margin-bottom: 20px;
        }

        .footer-cta-text {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .social-btn {
            flex: 1;
            background: #1e1e24;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease;
            display: inline-block;
        }

        .social-btn:hover {
            background: #2a2a32;
            border-color: #555;
        }

        .copyright {
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Попередження про AI концепт -->
    <div class="ai-disclaimer" id="aiDisclaimer">
        ⚠️ Увага: Усі речі та дизайни на сайті є ексклюзивними концептами, згенерованими штучним інтелектом.
    </div>

    <header>
        <div class="logo">LUMI.SHOP</div>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('uk')">UA</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </header>

    <div class="container">
        <div class="products-grid" id="productGrid">
            <!-- Товари генеруються динамічно -->
        </div>

        <!-- Футер та контакти -->
        <footer class="site-footer">
            <div class="footer-content">
                <p class="footer-cta-text" id="footerCta" data-uk="Сподобався сайт? Напиши мені в Telegram або Instagram!" data-en="Liked the site? Write to me on Telegram or Instagram!">Сподобався сайт? Напиши мені в Telegram або Instagram!</p>
                <div class="social-buttons">
                    <a href="https://t.me/maxiixw" target="_blank" class="social-btn">Telegram</a>
                    <a href="https://instagram.com/maxiixw" target="_blank" class="social-btn">Instagram</a>
                </div>
            </div>
            <p class="copyright">&copy; 2026 Lumi Shop. Усі права захищені.</p>
        </footer>
    </div>

    <!-- Нижня панель навігації -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="filterCategory('all', this)" data-uk="Усе" data-en="All">Усе</button>
        <button class="nav-item" onclick="filterCategory('hoodie', this)" data-uk="Худі" data-en="Hoodie">Худі</button>
        <button class="nav-item" onclick="filterCategory('jeans', this)" data-uk="Jeans" data-en="Jeans">Jeans</button>
        <button class="nav-item" onclick="filterCategory('pants', this)" data-uk="Pants" data-en="Pants">Pants</button>
        <button class="nav-item" onclick="filterCategory('tshirt', this)" data-uk="Футболки" data-en="T-Shirts">Футболки</button>
    </nav>

    <script>
        const products = [
            {
                id: 1,
                category: 'hoodie',
                badgeUk: 'Hoodie',
                badgeEn: 'Hoodie',
                title: 'Oversize Black Hoodie',
                descUk: 'Масивний чорний худі оверсайз крою з щільного трикотажу',
                descEn: 'Heavyweight oversized black hoodie',
                price: '280 zł',
                image: 'hoodie-1.jpg'
            },
            {
                id: 2,
                category: 'hoodie',
                badgeUk: 'Hoodie',
                badgeEn: 'Hoodie',
                title: 'Minimalist Dark Hoodie',
                descUk: 'Лаконічний худі вільного крою для повсякденних луків',
                descEn: 'Minimalist relaxed fit dark hoodie',
                price: '260 zł',
                image: 'hoodie-2.jpg'
            },
            {
                id: 3,
                category: 'hoodie',
                badgeUk: 'Hoodie',
                badgeEn: 'Hoodie',
                title: 'Graphic Print Hoodie',
                descUk: 'Худі з яскравим акцентним принтом на спині',
                descEn: 'Graphic print oversized hoodie',
                price: '290 zł',
                image: 'hoodie-3.jpg'
            },
            {
                id: 4,
                category: 'hoodie',
                badgeUk: 'Hoodie',
                badgeEn: 'Hoodie',
                title: 'Dark Aesthetic Hoodie',
                descUk: 'Базовий утеплений худі в глибоких темних відтінках',
                descEn: 'Basic warm hoodie in deep dark tones',
                price: '250 zł',
                image: 'hoodie-4.jpg'
            },
            {
                id: 5,
                category: 'jeans',
                badgeUk: 'Jeans',
                badgeEn: 'Jeans',
                title: 'Vintage Wide Denim',
                descUk: 'Широкі вінтажні джинси вільного крою з ефектом потертості',
                descEn: 'Vintage wide-leg denim jeans with subtle wash',
                price: '270 zł',
                image: 'jeansy.jpg'
            },
            {
                id: 6,
                category: 'jeans',
                badgeUk: 'Jeans',
                badgeEn: 'Jeans',
                title: 'Cargo Street Pants',
                descUk: 'Зручні штани карго з кишенями в міському стилі',
                descEn: 'Functional streetwear cargo pants',
                price: '260 zł',
                image: 'jeansy-2.jpg'
            },
            {
                id: 7,
                category: 'pants',
                badgeUk: 'Pants',
                badgeEn: 'Pants',
                title: 'Hello Kitty Print Pants',
                descUk: 'Стильні принтовані штани вільного крою',
                descEn: 'Relaxed fit printed statement pants',
                price: '240 zł',
                image: 'pants-1.jpg'
            },
            {
                id: 8,
                category: 'tshirt',
                badgeUk: 'T-Shirt',
                badgeEn: 'T-Shirt',
                title: 'Underground Tee',
                descUk: 'Базова чорна футболка оверсайз з щільної бавовни',
                descEn: 'Heavy cotton oversized black t-shirt',
                price: '140 zł',
                image: 'tshirt-1.png'
            },
            {
                id: 9,
                category: 'tshirt',
                badgeUk: 'T-Shirt',
                badgeEn: 'T-Shirt',
                title: 'Graphic Street Tee',
                descUk: 'Футболка з лаконічним графічним принтом спереду',
                descEn: 'Minimalist graphic streetwear t-shirt',
                price: '150 zł',
                image: 'tshirt-2.jpg'
            },
            {
                id: 10,
                category: 'tshirt',
                badgeUk: 'T-Shirt',
                badgeEn: 'T-Shirt',
                title: 'Dark Vibe Tee',
                descUk: 'Стильна футболка вільного крою для повсякденного гардероба',
                descEn: 'Casual relaxed fit dark vibe t-shirt',
                price: '140 zł',
                image: 'tshirt-3.jpg'
            }
        ];

        let currentLang = 'uk';
        let currentCategory = 'all';

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filtered = currentCategory === 'all' 
                ? products 
                : products.filter(p => p.category === currentCategory);

            filtered.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${index * 0.08}s`;
                
                const badgeText = currentLang === 'uk' ? p.badgeUk : p.badgeEn;
                const descText = currentLang === 'uk' ? p.descUk : p.descEn;
                const btnText = currentLang === 'uk' ? 'Купити' : 'Buy';

                card.innerHTML = `
                    <div class="product-image-container">
                        <img src="${p.image}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="product-content">
                        <span class="badge">${badgeText}</span>
                        <h2 class="product-title">${p.title}</h2>
                        <p class="product-desc">${descText}</p>
                        <div class="product-footer">
                            <span class="price">${p.price}</span>
                            <button class="buy-btn" onclick="openOrder('${p.title}')">${btnText}</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderProducts();
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.textContent = btn.getAttribute(`data-${lang}`);
            });

            const footerCta = document.getElementById('footerCta');
            footerCta.textContent = footerCta.getAttribute(`data-${lang}`);

            if (lang === 'en') {
                document.getElementById('aiDisclaimer').textContent = '⚠️ Note: All items and designs on the site are exclusive AI-generated concepts.';
            } else {
                document.getElementById('aiDisclaimer').textContent = '⚠️ Увага: Усі речі та дизайни на сайті є ексклюзивними концептами, згенерованими штучним інтелектом.';
            }

            renderProducts();
        }

        function openOrder(productName) {
            const text = currentLang === 'uk' 
                ? `Привіт! Хочу замовити ${productName}` 
                : `Hello! I want to order ${productName}`;
            window.open(`https://t.me/maxiixw?text=${encodeURIComponent(text)}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
